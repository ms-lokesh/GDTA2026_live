services:
  db:
    image: postgres:16-alpine
    container_name: gdta2026-postgres
    env_file:
      - backend/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gdta2026}
      POSTGRES_USER: ${POSTGRES_USER:-gdta2026}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace_me}
    ports:
      - "5432:5432"
    volumes:
      - gdta2026_postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: gdta2026-web
    env_file:
      - backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  gdta2026_postgres_data:
