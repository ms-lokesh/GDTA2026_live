services:
  - type: web
    name: gdta-admin-system
    runtime: python
    repo: https://github.com/SRAMBOT08/GDTA2026
    region: oregon
    plan: free
    branch: render-deployment
    rootDir: admin_system
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://gdta-admin-system.onrender.com,https://gdta-2026-website.onrender.com
      - key: REQUIRE_ORIGIN_FOR_STATE_CHANGING
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
