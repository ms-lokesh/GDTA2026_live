<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Login - GDTA 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #000000;
            --accent-color: #F2B705;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, #333 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            max-width: 450px;
            width: 100%;
        }
        
        .login-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-logo i {
            font-size: 3em;
            color: var(--accent-color);
        }
        
        .login-logo h2 {
            color: var(--primary-color);
            font-weight: 700;
            margin-top: 20px;
            margin-bottom: 5px;
        }
        
        .login-logo p {
            color: #6c757d;
            margin: 0;
        }
        
        .form-label {
            font-weight: 600;
            color: var(--primary-color);
        }
        
        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.2rem rgba(242, 183, 5, 0.25);
        }
        
        .btn-login {
            background: var(--accent-color);
            border: none;
            color: black;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .btn-login:hover {
            background: #d9a604;
            color: black;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(242, 183, 5, 0.4);
        }
        
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .alert {
            border-radius: 8px;
        }
        
        .info-box {
            background: #f8f9fa;
            border-left: 4px solid var(--accent-color);
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
        
        .info-box i {
            color: var(--accent-color);
        }
        
        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
            border-width: 0.2em;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <i class="fas fa-qrcode"></i>
                <h2>Volunteer Login</h2>
                <p>GDTA 2026 - QR Scanner Access</p>
            </div>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">
                        <i class="fas fa-user me-1"></i> Username
                    </label>
                    <input type="text" class="form-control" id="username" required 
                           placeholder="Enter your username" autocomplete="username">
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock me-1"></i> Password
                    </label>
                    <input type="password" class="form-control" id="password" required 
                           placeholder="Enter your password" autocomplete="current-password">
                </div>
                
                <div id="errorMessage" class="alert alert-danger hidden"></div>
                
                <button type="submit" class="btn btn-login w-100" id="loginBtn">
                    <i class="fas fa-sign-in-alt me-2"></i>
                    <span id="loginText">Login to QR Scanner</span>
                    <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2 hidden"></span>
                </button>
            </form>
            
            <div class="info-box">
                <p class="mb-0">
                    <i class="fas fa-info-circle me-2"></i>
                    <strong>For Volunteers Only</strong><br>
                    <small>Use your volunteer credentials to access the QR scanner system. 
                    Contact the admin if you don't have credentials.</small>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            const loginText = document.getElementById('loginText');
            const loginSpinner = document.getElementById('loginSpinner');
            
            // Hide previous errors
            errorDiv.classList.add('hidden');
            
            // Disable button and show loading
            loginBtn.disabled = true;
            loginText.textContent = 'Logging in...';
            loginSpinner.classList.remove('hidden');
            
            try {
                const response = await fetch('/api/volunteer/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    // Login successful - redirect to QR scanner
                    window.location.href = '/static/qr-scanner.html';
                } else {
                    // Login failed - show error
                    errorDiv.textContent = data.error || 'Login failed. Please try again.';
                    errorDiv.classList.remove('hidden');
                    
                    // Re-enable button
                    loginBtn.disabled = false;
                    loginText.textContent = 'Login to QR Scanner';
                    loginSpinner.classList.add('hidden');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = 'Connection failed. Please check your internet and try again.';
                errorDiv.classList.remove('hidden');
                
                // Re-enable button
                loginBtn.disabled = false;
                loginText.textContent = 'Login to QR Scanner';
                loginSpinner.classList.add('hidden');
            }
        });
        
        // Check if already logged in
        async function checkAuth() {
            try {
                const response = await fetch('/api/volunteer/me', {
                    credentials: 'include'
                });
                
                if (response.ok) {
                    // Already logged in - redirect to scanner
                    window.location.href = '/static/qr-scanner.html';
                }
            } catch (error) {
                // Not logged in - stay on this page
            }
        }
        
        // Check auth on page load
        checkAuth();
    </script>
</body>
</html>
