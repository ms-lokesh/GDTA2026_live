<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Setup - GDTA 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .setup-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        .setup-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .setup-header h1 {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .setup-header p {
            color: #6c757d;
            font-size: 14px;
        }
        .form-label {
            color: #495057;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 2px solid #e9ecef;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-setup {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            color: white;
            width: 100%;
            margin-top: 20px;
        }
        .btn-setup:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .alert-custom {
            border-radius: 10px;
            border: none;
        }
        .icon-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .icon-container i {
            font-size: 40px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="setup-container">
        <div class="setup-header">
            <div class="icon-container">
                <i class="fas fa-crown"></i>
            </div>
            <h1>Super Admin Setup</h1>
            <p>Create the master administrator account</p>
        </div>

        <div id="alertContainer"></div>

        <form id="setupForm">
            <div class="mb-3">
                <label for="username" class="form-label">
                    <i class="fas fa-user"></i> Username
                </label>
                <input type="text" class="form-control" id="username" required 
                       placeholder="Enter username (e.g., superadmin)">
                <small class="text-muted">Minimum 3 characters, no spaces</small>
            </div>

            <div class="mb-3">
                <label for="name" class="form-label">
                    <i class="fas fa-id-card"></i> Full Name
                </label>
                <input type="text" class="form-control" id="name" required 
                       placeholder="Enter full name">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">
                    <i class="fas fa-envelope"></i> Email
                </label>
                <input type="email" class="form-control" id="email" required 
                       placeholder="admin@example.com">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">
                    <i class="fas fa-lock"></i> Password
                </label>
                <input type="password" class="form-control" id="password" required 
                       placeholder="Enter strong password" minlength="8">
                <small class="text-muted">Minimum 8 characters</small>
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label">
                    <i class="fas fa-lock"></i> Confirm Password
                </label>
                <input type="password" class="form-control" id="confirmPassword" required 
                       placeholder="Re-enter password">
            </div>

            <button type="submit" class="btn btn-setup">
                <i class="fas fa-check-circle"></i> Create Super Admin
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="admin-dashboard.html" class="text-muted" style="text-decoration: none; font-size: 14px;">
                <i class="fas fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = '/api';

        document.getElementById('setupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Clear previous alerts
            document.getElementById('alertContainer').innerHTML = '';

            // Validation
            if (username.length < 3) {
                showAlert('Username must be at least 3 characters long', 'danger');
                return;
            }

            if (username.includes(' ')) {
                showAlert('Username cannot contain spaces', 'danger');
                return;
            }

            if (password.length < 8) {
                showAlert('Password must be at least 8 characters long', 'danger');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('Passwords do not match', 'danger');
                return;
            }

            // Create super admin
            try {
                const response = await fetch(`${API_BASE}/super-admin-setup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        name,
                        email,
                        password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('Super Admin created successfully! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = 'admin-dashboard.html';
                    }, 2000);
                } else {
                    showAlert(data.error || 'Failed to create super admin', 'warning');
                }
            } catch (error) {
                console.error('Setup error:', error);
                showAlert('Connection error. Please try again.', 'danger');
            }
        });

        function showAlert(message, type) {
            const alert = `
                <div class="alert alert-${type} alert-custom alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            document.getElementById('alertContainer').innerHTML = alert;
        }
    </script>
</body>
</html>
