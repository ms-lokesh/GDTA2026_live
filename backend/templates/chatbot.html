<!DOCTYPE html>
<html lang="en">
<head>
    <link href="/static/css/mobile.css" rel="stylesheet">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GDTA 2026 Chat Assistant</title>
    <style>
        :root { color-scheme: light; }
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fb; }
        .app { display: flex; flex-direction: column; height: 100vh; }
        .header { padding: 12px 14px; color: #fff; background-image: linear-gradient(rgba(39,34,88,.72), rgba(39,34,88,.72)), url('/static/img/Background/travel_stay_bg.png'); background-size: cover; background-position: center; }
        .header h3 { margin: 0; font-size: 15px; }
        .controls { display: none; }
        select, button, input { font: inherit; }
        select { flex: 1; border: 1px solid #d6dbea; border-radius: 8px; padding: 8px; background: #fff; }
        button { border: none; border-radius: 8px; padding: 8px 10px; cursor: pointer; background: #3f66ff; color: #fff; font-weight: 600; }
        button.secondary { background: #edf1ff; color: #2d3a76; }
        .chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 90%; padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; line-height: 1.35; font-size: 13px; }
        .bot { background: #ffffff; border: 1px solid #e5e8f0; color: #1f2847; align-self: flex-start; }
        .user { background: #3f66ff; color: #fff; align-self: flex-end; }
        .input { display: flex; gap: 8px; padding: 10px; background: #fff; border-top: 1px solid #e7eaf3; }
        .input input { flex: 1; border: 1px solid #d6dbea; border-radius: 8px; padding: 10px; }
        .small { font-size: 11px; color: #6a738b; padding: 0 12px 10px; background: #fff; }
        a { color: #1543d3; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h3>GDTA 2026 Chat Assistant</h3>
    </div>

    <div id="chat" class="chat"></div>

    <div class="input">
        <input id="message" type="text" placeholder="Type your message..." />
        <button id="sendBtn">Send</button>
    </div>
</div>

<script>
(function () {
    const DEFAULT_MODE = 'conference_assistant';
    const chat = document.getElementById('chat');
    const msgEl = document.getElementById('message');
    const sendBtn = document.getElementById('sendBtn');

    let sessionId = null;

    function addMessage(text, kind = 'bot') {
        const div = document.createElement('div');
        div.className = `msg ${kind}`;
        div.innerHTML = String(text || '').replace(/\n/g, '<br/>');
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function paymentMarkup(payment, paymentError) {
        if (payment && payment.payment_link) {
            return `\n\nPayment link: <a href="${payment.payment_link}" target="_blank" rel="noopener">Open payment page</a>`;
        }
        if (paymentError) {
            return `\n\nRegistration is done, but payment link couldn't be created now: ${paymentError}`;
        }
        return '';
    }

    async function startSession() {
        sessionId = null;

        const res = await fetch('/api/chatbot/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mode: DEFAULT_MODE })
        });
        const body = await res.json();
        if (!res.ok || body.success === false) {
            addMessage(body?.error?.message || 'Unable to start chatbot session.', 'bot');
            return;
        }

        sessionId = body.data.session_id;
        addMessage(body.data.bot_message || 'Session started.', 'bot');
    }

    async function sendMessage() {
        const text = (msgEl.value || '').trim();
        if (!text) return;
        if (!sessionId) {
            await startSession();
            if (!sessionId) {
                addMessage('Unable to initialize chat session. Please try again.', 'bot');
                return;
            }
        }

        addMessage(text, 'user');
        msgEl.value = '';

        const res = await fetch('/api/chatbot/message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: sessionId, message: text })
        });
        const body = await res.json();

        if (!res.ok || body.success === false) {
            addMessage(body?.error?.message || 'Something went wrong.', 'bot');
            return;
        }

        const data = body.data || {};
        let responseText = data.bot_message || 'Done.';

        if (data.mode === 'conference_registration' && data.completed) {
            responseText += paymentMarkup(data.payment, data.payment_error);
        }
        if (data.mode === 'event_planner' && data.plan) {
            responseText += `\n\nDay 1:\n${(data.plan.day_1 || []).map(x => `- ${x.time}: ${x.activity}`).join('\n')}`;
            responseText += `\n\nDay 2:\n${(data.plan.day_2 || []).map(x => `- ${x.time}: ${x.activity}`).join('\n')}`;
        }

        addMessage(responseText, 'bot');
    }

    sendBtn.addEventListener('click', sendMessage);
    msgEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    startSession();
})();
</script>
</body>
<script src="/static/js/mobile-nav.js"></script>
</html>
