<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDTA 2026 Registration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 0.9em;
        }

        .progress-bar {
            height: 6px;
            background: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 10px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .question-container {
            margin-bottom: 25px;
        }

        .question-label {
            display: block;
            font-size: 1.1em;
            color: #333;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .step-indicator {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            text-align: left;
        }

        .option-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateX(5px);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #c33;
            display: none;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .success-message {
            background: #efe;
            color: #2a7;
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #2a7;
            display: none;
        }

        .summary-box {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #667eea;
        }

        .summary-box h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .summary-label {
            font-weight: 600;
            color: #666;
        }

        .summary-value {
            color: #333;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .completed-message {
            text-align: center;
            padding: 40px 20px;
        }

        .completed-message h2 {
            color: #2a7;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .completed-message p {
            color: #666;
            margin-bottom: 20px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .secondary-btn {
            flex: 1;
            padding: 12px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .secondary-btn:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>GDTA 2026</h1>
            <p>Conference Registration</p>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p style="margin-top: 10px; color: #666;">Loading...</p>
        </div>

        <div id="questionContainer" class="question-container"></div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000';
        let sessionId = null;
        let currentStep = null;
        const totalSteps = 10; // Approximate total steps

        const stepOrder = ['consent', 'name', 'institution', 'role', 'gdta_member', 'gdta_affiliation', 
                          'country', 'state', 'email', 'review', 'confirmation', 'completed'];

        async function startRegistration() {
            showLoading(true);
            try {
                const response = await fetch(`${API_BASE}/api/register/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });

                const data = await response.json();
                sessionId = data.session_id;
                currentStep = data.state.current_step;
                
                displayQuestion(data);
                updateProgress();
            } catch (error) {
                showError('Failed to start registration. Please ensure the server is running.');
            } finally {
                showLoading(false);
            }
        }

        async function submitAnswer(answer) {
            showLoading(true);
            hideMessages();

            try {
                const response = await fetch(`${API_BASE}/api/register/answer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionId,
                        answer: answer
                    })
                });

                const data = await response.json();

                if (data.success) {
                    currentStep = data.state?.current_step;
                    
                    if (data.completed) {
                        displayCompleted(data);
                    } else if (data.cancelled) {
                        displayCancelled(data);
                    } else {
                        displayQuestion(data);
                        showSuccess(data.message);
                    }
                    updateProgress();
                } else {
                    showError(data.message);
                    // Redisplay current question
                    if (data.next_question) {
                        displayQuestion(data);
                    }
                }
            } catch (error) {
                showError('Failed to submit answer. Please try again.');
            } finally {
                showLoading(false);
            }
        }

        function displayQuestion(data) {
            const container = document.getElementById('questionContainer');
            const question = data.next_question || data.question;

            if (!question) return;

            let html = `<div class="step-indicator">${question.field || currentStep}</div>`;
            html += `<label class="question-label">${question.question}</label>`;

            if (question.validation_type === 'review') {
                html += displayReview(data);
            } else if (question.validation_type === 'confirmation') {
                html += displayConfirmation(data);
            } else if (question.options && question.options.length > 0) {
                html += '<div class="options-container">';
                question.options.forEach(option => {
                    html += `<button class="option-btn" onclick="submitAnswer('${option}')">${option}</button>`;
                });
                html += '</div>';
            } else if (question.validation_type === 'email') {
                html += `<input type="email" id="answerInput" placeholder="Enter your email address">`;
                html += `<button class="submit-btn" onclick="submitTextAnswer()">Continue</button>`;
            } else {
                html += `<input type="text" id="answerInput" placeholder="Type your answer here">`;
                html += `<button class="submit-btn" onclick="submitTextAnswer()">Continue</button>`;
            }

            container.innerHTML = html;

            // Add enter key listener for text inputs
            const input = document.getElementById('answerInput');
            if (input) {
                input.focus();
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') submitTextAnswer();
                });
            }
        }

        function displayReview(data) {
            const registrationData = data.state?.data || {};
            
            let html = '<div class="summary-box"><h3>Review Your Details</h3>';
            
            const fields = [
                { key: 'name', label: 'Name' },
                { key: 'institution', label: 'Institution' },
                { key: 'role', label: 'Role' },
                { key: 'gdta_member', label: 'GDTA Member' },
                { key: 'gdta_affiliation', label: 'GDTA Affiliation' },
                { key: 'country', label: 'Country' },
                { key: 'state', label: 'State' },
                { key: 'email', label: 'Email' }
            ];

            fields.forEach(field => {
                const value = registrationData[field.key];
                if (value) {
                    html += `<div class="summary-item">
                        <span class="summary-label">${field.label}:</span>
                        <span class="summary-value">${value}</span>
                    </div>`;
                }
            });

            html += '</div>';
            html += '<div class="button-group">';
            html += '<button class="secondary-btn" onclick="editField()">Edit Field</button>';
            html += '<button class="submit-btn" onclick="submitAnswer(\'continue\')">Continue</button>';
            html += '</div>';

            return html;
        }

        function displayConfirmation(data) {
            const summary = data.summary || 'Please confirm your registration.';
            
            let html = '<div class="summary-box">';
            html += summary.replace(/\n/g, '<br>');
            html += '</div>';
            html += '<div class="button-group">';
            html += '<button class="secondary-btn" onclick="submitAnswer(\'EDIT\')">Edit Details</button>';
            html += '<button class="submit-btn" onclick="submitAnswer(\'CONFIRM\')">Confirm & Submit</button>';
            html += '</div>';

            return html;
        }

        function displayCompleted(data) {
            const container = document.getElementById('questionContainer');
            container.innerHTML = `
                <div class="completed-message">
                    <h2>✓ Registration Complete!</h2>
                    <p>${data.message}</p>
                    <button class="submit-btn" onclick="location.reload()">Start New Registration</button>
                </div>
            `;
            updateProgress(100);
        }

        function displayCancelled(data) {
            const container = document.getElementById('questionContainer');
            container.innerHTML = `
                <div class="completed-message">
                    <h2>Registration Cancelled</h2>
                    <p>${data.message}</p>
                    <button class="submit-btn" onclick="location.reload()">Start New Registration</button>
                </div>
            `;
        }

        function editField() {
            const fieldName = prompt('Enter field name to edit (name, institution, role, gdta_member, gdta_affiliation, country, state, email):');
            if (fieldName) {
                submitAnswer(fieldName.toLowerCase());
            }
        }

        function submitTextAnswer() {
            const input = document.getElementById('answerInput');
            if (input && input.value.trim()) {
                submitAnswer(input.value.trim());
            } else {
                showError('Please enter an answer');
            }
        }

        function updateProgress(percent) {
            if (percent !== undefined) {
                document.getElementById('progressFill').style.width = percent + '%';
                return;
            }

            const currentIndex = stepOrder.indexOf(currentStep);
            const progressPercent = currentIndex >= 0 ? (currentIndex / stepOrder.length) * 100 : 0;
            document.getElementById('progressFill').style.width = progressPercent + '%';
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('questionContainer').style.display = show ? 'none' : 'block';
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => errorEl.style.display = 'none', 5000);
        }

        function showSuccess(message) {
            const successEl = document.getElementById('successMessage');
            successEl.textContent = message;
            successEl.style.display = 'block';
            setTimeout(() => successEl.style.display = 'none', 3000);
        }

        function hideMessages() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }

        // Initialize on page load
        window.onload = () => {
            startRegistration();
        };
    </script>
</body>
</html>
