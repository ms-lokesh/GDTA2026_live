<div class="app">
    <div class="header">
        <h3>GDTA 2026 Chat Assistant</h3>
    </div>

    <div id="chat" class="chat"></div>

    <div class="input">
        <input id="message" type="text" placeholder="Type your message..." />
        <button id="sendBtn">Send</button>
    </div>
</div>

<script>
(function () {
    const chat = document.getElementById('chat');
    const msgEl = document.getElementById('message');
    const sendBtn = document.getElementById('sendBtn');

    function addMessage(text, kind = 'bot') {
        const div = document.createElement('div');
        div.className = `msg ${kind}`;
        div.innerHTML = String(text || '').replace(/
/g, '<br/>');
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function getBotResponse(message) {
        const msg = message.toLowerCase();
        if (msg.includes('register') || msg.includes('price') || msg.includes('fee') || msg.includes('cost') || msg.includes('ticket') || msg.includes('payment')) {
            return "You can register for the conference directly at our registration page (register.html). The standard fee for students is INR 3,000 + GST, academicians is INR 4,500 + GST, and corporate delegates is INR 6,000 + GST. International registrations are also available.";
        }
        if (msg.includes('date') || msg.includes('when') || msg.includes('time') || msg.includes('schedule')) {
            return "GDTA 2026 will take place on September 29-30, 2026. You can view the full schedule on our Details & Schedule page (program-schedule.html).";
        }
        if (msg.includes('where') || msg.includes('location') || msg.includes('venue') || msg.includes('place') || msg.includes('city') || msg.includes('coimbatore')) {
            return "The conference is hosted at SNS Institutions, Coimbatore, Tamil Nadu, India. For travel and stay assistance, please visit our Travel & Stay page (travel-stay.html).";
        }
        if (msg.includes('contact') || msg.includes('email') || msg.includes('support') || msg.includes('help') || msg.includes('phone')) {
            return "You can contact our support team at info@gdta2026.com or use the Contact Us page (contact.html).";
        }
        if (msg.includes('hackathon')) {
            return "The GDTA'26 Hackathon is an exciting challenge on Education, Smart City, and Healthcare tracks. Register on Unstop or read more on our Hackathon page (hackathon.html).";
        }
        if (msg.includes('safari') || msg.includes('route') || msg.includes('tour')) {
            return "The Coimbatore Innovation Safari features 3 routes covering spiritual origins, living heritage, and industrial legacy. You can select a route during conference registration or on the Safari page (program-safari.html).";
        }
        return "Thank you for your message! As the conference backend is currently offline, please check our website pages or email us at info@gdta2026.com for detailed inquiries.";
    }

    function sendMessage() {
        const text = (msgEl.value || '').trim();
        if (!text) return;
        addMessage(text, 'user');
        msgEl.value = '';
        
        setTimeout(() => {
            const reply = getBotResponse(text);
            addMessage(reply, 'bot');
        }, 500);
    }

    sendBtn.addEventListener('click', sendMessage);
    msgEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // Welcome message
    setTimeout(() => {
        addMessage("Hello! I am the GDTA 2026 Virtual Assistant. How can I help you today?", 'bot');
    }, 200);
})();
</script>
