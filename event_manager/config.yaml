# Event Manager Configuration
# Copy this file to config.yaml and update with your event details

# Application Settings
app:
  name: "Event Manager"
  version: "1.0.0"
  debug: true
  port: 5002
  secret_key: "change-this-to-a-random-secret-key-in-production"

# Event Branding (can be overridden in database by super admin)
branding:
  organization_name: "Your Organization"
  default_event_name: "Your Event 2026"
  support_email: "support@yourevent.com"
  website_url: "https://yourevent.com"
  
# CORS Settings
cors:
  allowed_origins:
    - "http://localhost:5000"
    - "http://127.0.0.1:5000"
    - "http://127.0.0.1:5500"
    - "null"  # For local file:// testing
  
# Session Settings
session:
  type: "filesystem"
  cookie_samesite: "Lax"
  cookie_httponly: true
  cookie_secure: false  # Set to true in production with HTTPS

# ID Card Settings
id_card:
  template_path: "templates/id_card/id_card_config.json"
  output_dir: "static/generated_ids"
  font_path: "static/fonts"
  # Temporary storage warning for cloud deployments
  ephemeral_storage_warning: true

# Email Settings (optional - configure if using email features)
email:
  enabled: false
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  sender_email: "noreply@yourevent.com"
  sender_name: "Event Team"
  
# Database Settings
database:
  type: "firebase"
  # Firebase credentials should be in firebase-credentials.json or FIREBASE_CREDENTIALS env var
  
# Features (enable/disable specific features)
features:
  registration: true
  check_in: true
  email_templates: true
  id_card_generation: true
  volunteer_dashboard: true
  hackathon_module: true
  schedule_planner: true
  bulk_operations: true
  
# Admin Settings
admin:
  # Default super admin (created on first run)
  default_super_admin:
    username: "admin"
    password: "changeme123"  # CHANGE THIS!
    name: "Super Admin"
    email: "admin@yourevent.com"
    
# File Upload Limits
uploads:
  max_file_size: 5242880  # 5MB in bytes
  allowed_extensions:
    - "png"
    - "jpg"
    - "jpeg"
    - "pdf"
    
# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "detailed"  # simple or detailed
